[package]
name = "jarvis-task-engine"
version.workspace = true
edition.workspace = true

# Task lifecycle state machine, persistence, and task model.
# Core of the JARVIS work tracking system.
# Phase 3, Milestones M03.03 - M03.07

[dependencies]
tokio = { workspace = true, features = ["full", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid", "serde_json"] }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3.17"
